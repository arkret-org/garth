name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  native:
    name: native check + test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout garth
        uses: actions/checkout@v4
        with:
          path: garth

      # arkret-rust-sdk is a local path dependency; check it out as a sibling
      # so `../arkret-rust-sdk/crates/*` resolves.
      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Spec fixtures
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@nightly
        if: matrix.os == 'ubuntu-latest'
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: garth
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: garth
        run: cargo +nightly fmt --all -- --check
      - name: Clippy
        working-directory: garth
        run: cargo clippy --features native --all-targets -- -D warnings
      - name: Runtime layering
        working-directory: garth
        run: python scripts/check_layering.py
      - name: Tests
        working-directory: garth
        run: cargo test --features native

  ios:
    name: iOS compile gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: garth
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: aarch64-apple-ios
      - name: Check iOS library surface
        working-directory: garth
        run: cargo check --lib --target aarch64-apple-ios

  android:
    name: Android compile gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: garth
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: aarch64-linux-android
      - name: Configure Android NDK compiler
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$toolchain/aarch64-linux-android21-clang"
          {
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android21-clang"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android21-clang"
          } >> "$GITHUB_ENV"
      - name: Check Android library surface
        working-directory: garth
        run: cargo check --lib --target aarch64-linux-android

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout garth
        uses: actions/checkout@v4
        with:
          path: garth
      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: garth
      - name: Wasm check
        working-directory: garth
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm
