# cargo-deny policy for the garth client engine and its SDK dependency graph.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

# imbl replaces the previous persistent map implementation under the same
# MPL file-level license; retain the upstream license notices in distributions.
[[licenses.exceptions]]
name = "imbl"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "imbl-sized-chunks"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
