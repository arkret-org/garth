
[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming", "cryptography"]
description = "Runtime-neutral shared client engine for Arkret v1 applications."
edition = "2024"
homepage = "https://github.com/arkret-org/garth"
keywords = ["arkret", "client", "garth"]
license = "Apache-2.0"
name = "garth"
readme = "README.md"
repository = "https://github.com/arkret-org/garth"
rust-version = "1.98"
version = "0.3.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"

[features]
default = []
native = ["dep:tokio"]
route-material-test-support = []
wasm = ["dep:gloo-timers"]

[dependencies]
arkret-auth = { version = "0.3.0", path = "../arkret-rust-sdk/crates/auth", default-features = false }
arkret-canonical = { version = "0.3.0", path = "../arkret-rust-sdk/crates/canonical", default-features = false }
arkret-http-client = { version = "0.3.0", path = "../arkret-rust-sdk/crates/http-client", default-features = false }
arkret-hlc = { version = "0.3.0", path = "../arkret-rust-sdk/crates/hlc", default-features = false }
arkret-identifiers = { version = "0.3.0", path = "../arkret-rust-sdk/crates/identifiers", default-features = false }
arkret-identity = { version = "0.3.0", path = "../arkret-rust-sdk/crates/identity", default-features = false }
arkret-keystore = { version = "0.3.0", path = "../arkret-rust-sdk/crates/keystore", default-features = false }
arkret-models-collaboration = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-collaboration", default-features = false }
arkret-models-identity = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-identity", default-features = false }
arkret-models-discovery = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-discovery", default-features = false }
arkret-models-crypto = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-crypto", default-features = false }
arkret-signatures = { version = "0.3.0", path = "../arkret-rust-sdk/crates/signatures", default-features = false, features = ["collaboration"] }
arkret-wire = { version = "0.3.0", path = "../arkret-rust-sdk/crates/wire", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde", "wasmbind"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "rand_core"] }
thiserror = { version = "2.0.20", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync", "time"], optional = true }
url = { version = "2.5", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", default-features = false, features = ["futures"], optional = true }

[dev-dependencies]
arkret-wire = { version = "0.3.0", path = "../arkret-rust-sdk/crates/wire", default-features = false, features = ["test-support"] }
tempfile = "3.23.0"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
