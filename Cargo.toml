[workspace]

[package]
authors = ["Chris Young <chris@sonc.ai>"]
categories = ["api-bindings", "network-programming", "cryptography"]
description = "Runtime-neutral shared client engine for Arkret v1 applications."
edition = "2024"
homepage = "https://github.com/arkret-org/garth"
keywords = ["arkret", "client", "garth"]
license = "Apache-2.0"
name = "garth"
readme = "README.md"
repository = "https://github.com/arkret-org/garth"
rust-version = "1.97"
version = "0.3.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
client = []
native = ["dep:tokio", "client"]
wasm = ["dep:gloo-timers", "client"]

[dependencies]
chrono = {version = "0.4.45",default-features = false,features = ["clock", "std", "serde", "wasmbind"]}
chacha20poly1305 = {version = "0.10.1",default-features = false,features = ["alloc"]}
arkret-auth = {version = "0.3.0",path = "../arkret-rust-sdk/crates/auth",default-features = false}
arkret-canonical = {version = "0.3.0",path = "../arkret-rust-sdk/crates/canonical",default-features = false}
arkret-crypto = {version = "0.3.0",path = "../arkret-rust-sdk/crates/crypto",default-features = false,features = ["account-data", "aead", "identity-root"]}
arkret-event-draft = {version = "0.3.0",path = "../arkret-rust-sdk/crates/event-draft",default-features = false}
arkret-hlc = {version = "0.3.0",path = "../arkret-rust-sdk/crates/hlc",default-features = false}
arkret-identifiers = {version = "0.3.0",path = "../arkret-rust-sdk/crates/identifiers",default-features = false}
arkret-identity = {version = "0.3.0",path = "../arkret-rust-sdk/crates/identity",default-features = false}
arkret-keystore = {version = "0.3.0",path = "../arkret-rust-sdk/crates/keystore",default-features = false}
arkret-models-collaboration = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-collaboration",default-features = false}
arkret-models-crypto = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-crypto",default-features = false}
arkret-models-discovery = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-discovery",default-features = false}
arkret-models-identity = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-identity",default-features = false}
arkret-policy = {version = "0.3.0",path = "../arkret-rust-sdk/crates/policy",default-features = false}
arkret-http-client = {version = "0.3.0",path = "../arkret-rust-sdk/crates/http-client",default-features = false}
arkret-schema = {version = "0.3.0",path = "../arkret-rust-sdk/crates/schema",default-features = false}
arkret-signatures = {version = "0.3.0",path = "../arkret-rust-sdk/crates/signatures",default-features = false,features = ["collaboration", "service-identity"]}
arkret-state = {version = "0.3.0",path = "../arkret-rust-sdk/crates/state",default-features = false}
arkret-wire = {version = "0.3.0",path = "../arkret-rust-sdk/crates/wire",default-features = false}
ed25519-dalek = {version = "2.2.0",default-features = false,features = ["std", "rand_core"]}
getrandom = {version = "0.4.3",default-features = false,features = ["std", "wasm_js"]}
hkdf = {version = "0.13.0",default-features = false}
serde = {version = "1.0.228",default-features = false,features = ["std", "derive"]}
serde_json = {version = "1.0.150",default-features = false,features = ["std"]}
sha2 = {version = "0.11.0",default-features = false}
thiserror = {version = "2.0.18",default-features = false}
tokio = {version = "1.52.3",default-features = false,features = ["rt", "sync", "time"],optional = true}
zeroize = {version = "1.8.2",default-features = false,features = ["derive"]}
uuid = {version = "1.23",default-features = false,features = ["std", "v7"]}
url = {version = "2.5",default-features = false}

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = {version = "0.3",default-features = false,features = ["futures"],optional = true}

[dev-dependencies]
arkret-wire = {version = "0.3.0",path = "../arkret-rust-sdk/crates/wire",default-features = false,features = ["test-support"]}
proptest = {version = "1",default-features = false,features = ["std"]}
tokio = {version = "1.52.3",default-features = false,features = ["macros", "rt", "sync", "time"]}

[[example]]
name = "minimal-client"
required-features = ["native"]
